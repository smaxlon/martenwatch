name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - name: Preserve CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Fail if CodeQL reports findings
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-results
        run: node scripts/check-codeql-sarif.mjs
